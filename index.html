<!doctype html>
<html lang="en" data-skin="atrius" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/style.css" />
    <title>Nod</title>
    <script>
      // Before the page module loads: the palette follows the system until `nod.info` answers
      // (src/app.ts applies the stored skin, mode and colours), so a light machine never opens on
      // the dark floor. Only the resolved palette is set here; the skin stays Atrius, the default.
      document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches
        ? 'dark'
        : 'light';
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
