# Builds Nod for every desktop target with Electrobun and publishes the installer/update artifacts
# plus the legacy `manifest.json` as a GitHub Release. Electrobun is the only runtime.
#
# Targets (docs/distribuicao.md §8):
#   macOS arm64 / x86_64, Linux x86_64 / arm64, Windows x64 / arm64.
#
# macOS ships a zip of the `.app` (the Homebrew cask and the macOS updater read it) and the
# runtime's own update artifacts. Windows/Linux ship the runtime's installer and `stable-*-update.json`
# + `.tar.zst`; the app's updater reads those. A release no longer carries a tinyjs build, so a
# Windows/Linux installation on a 0.7.0c build must install 0.8.0 once (the release notes say so).
name: release

on:
  push:
    branches: ['release-*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  BUN_VERSION: 1.4.3

jobs:
  prepare:
    name: check version and tests
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        name: read version
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          version=$(jq -r '.version' app.json)
          # semver, plus hotfix letters right after the patch: 0.5.5a, 0.5.5b (docs/distribuicao.md §8).
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+[a-z]*([-+].*)?$ ]]; then
            echo "::error file=app.json::version '$version' is not X.Y.Z or X.Y.Z<letters> (a hotfix, as in 0.5.5a)"
            exit 1
          fi
          # release-1.2.3 (or release-1.2.3a) must match app.json; other release-* names skip the check.
          suffix="${BRANCH#release-}"
          if [[ "$suffix" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+ ]] && [[ "${suffix#v}" != "$version" ]]; then
            echo "::error file=app.json::branch $BRANCH says ${suffix#v} but app.json says $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The tag carries the release prefix (docs/canonico.md §19: versions follow `release-*`).
          echo "tag=release-$version" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: host
      - run: bun run typecheck:app
      - run: bun test test/

  build:
    name: build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      # Every leg runs to the end so one failure does not hide another; the release job still needs
      # all of them.
      fail-fast: false
      matrix:
        include:
          - { target: macos-arm64,   os: macos-15,       platform: macos, arch: arm64,  runtime_arch: arm64 }
          - { target: macos-x86_64,  os: macos-15-intel, platform: macos, arch: x86_64, runtime_arch: x64 }
          - { target: linux-x86_64,  os: ubuntu-24.04,   platform: linux, arch: x86_64, runtime_arch: x64 }
          - { target: linux-arm64,   os: ubuntu-24.04-arm, platform: linux, arch: arm64, runtime_arch: arm64 }
          - { target: windows-x64,   os: windows-2025,   platform: win,   arch: x86_64, runtime_arch: x64 }
          - { target: windows-arm64, os: windows-11-arm, platform: win,   arch: arm64,  runtime_arch: arm64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          # The notes step looks back for the `Release <version>:` commit (see below).
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: install Linux runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0 libayatana-appindicator3-1 imagemagick

      - run: bun install --frozen-lockfile

      # The private seed (and any icon it references) never enters git (AGENTS.md). It arrives as
      # the NOD_PRIVATE_RESOURCES secret: base64 of a tar.gz whose paths are relative to resources/.
      - name: restore private resources
        env:
          NOD_PRIVATE_RESOURCES: ${{ secrets.NOD_PRIVATE_RESOURCES }}
        run: |
          if [ -z "$NOD_PRIVATE_RESOURCES" ]; then
            echo "::error::secret NOD_PRIVATE_RESOURCES is missing (docs/distribuicao.md §8)"
            exit 1
          fi
          printf '%s' "$NOD_PRIVATE_RESOURCES" | base64 -d | tar -xzf - -C resources
          test -f resources/seed.json || { echo "::error::NOD_PRIVATE_RESOURCES has no seed.json"; exit 1; }
          if [ -f resources/icon.png ]; then
            echo "app icon: resources/icon.png (custom, from NOD_PRIVATE_RESOURCES)"
          else
            echo "app icon: assets/icon.png (tracked default)"
          fi

      # RF-56 for every target: the private icon from NOD_PRIVATE_RESOURCES has to be the one the
      # bundle wears. `dev` on purpose — the icon choice is the same in both modes, and `build`
      # refuses to generate before `bun run build` writes `dist/`.
      - name: check the app icon
        run: |
          bun scripts/gen-electrobun-config.ts dev
          icon=$(bun -e 'const { default: config } = await import("./electrobun.config.ts"); console.log(config.build.win?.icon ?? "none")')
          echo "electrobun.config.ts icon: $icon"
          if [ -f resources/icon.png ] && [ "$icon" != "resources/icon.png" ]; then
            echo "::error::NOD_PRIVATE_RESOURCES carries icon.png but the build would use $icon"
            exit 1
          fi

      # One command per host: the native helper and icon set on macOS, the page bundle, the generated
      # config and `electrobun build --env=stable`.
      - name: build the app
        env:
          NOD_APP_ID: copland.nod
        run: bun run eb:build

      # The devkit is projected now, so the Electrobun project is typechecked for real.
      - name: typecheck (Electrobun project)
        run: bunx tsc -p electrobun/tsconfig.json --noEmit

      # Camera/microphone are gated by the two usage strings in the plist the app runs with. On
      # macOS `eb:build` asserts them; this step keeps the contract visible before publishing.
      - name: verify the macOS bundle
        if: matrix.platform == 'macos'
        run: bun run eb:verify

      - name: verify the shipped signature
        if: matrix.platform == 'macos'
        run: codesign --verify --strict --deep "build/stable-macos-${{ matrix.runtime_arch }}/Nod.app"

      # The notes are the body of the `Release <version>:` commit — what installed Nods show in the
      # update notice (RF-55). A merge commit (`Merge pull request #…`) or a dispatched run (no
      # head_commit, the case of release-branch.yml) would otherwise publish a header or nothing.
      - name: release notes
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # `--no-merges`: a merge commit's body is the PR title (`Release X — …`), which would match
          # first and publish one line instead of the notes (it did, on release-0.5.0).
          pattern="^Release ${VERSION//./\\.}:"
          notes=$(git log -1 --no-merges --extended-regexp --grep="$pattern" --format=%B)
          [ -n "$notes" ] || notes="$MESSAGE"
          [ -n "$notes" ] || notes=$(git log -1 --format=%B)
          # GitHub's merge header (and the blank line after it) is not news for anyone.
          notes=$(printf '%s\n' "$notes" | sed '/^Merge pull request #/,/^$/d')
          printf '%s\n' "${notes:-Nod $VERSION}" > "${{ runner.temp }}/release-notes.md"

      # One macOS half (`mac.<arch>` + zip) or one Windows/Linux artifact set (the runtime's own
      # update metadata/archive + installer). The release job merges the macOS halves.
      - name: publish
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          bun scripts/eb-publish.ts build \
            --platform "$PLATFORM" \
            --arch "$ARCH" \
            --version "$VERSION" \
            --base-url "https://github.com/${{ vars.NOD_RELEASE_REPO || github.repository }}/releases/latest/download" \
            --notes-file "${{ runner.temp }}/release-notes.md" \
            --out dist/publish
          ls -la dist/publish

      - uses: actions/upload-artifact@v7
        with:
          name: publish-${{ matrix.target }}
          path: dist/publish/
          if-no-files-found: error
          retention-days: 3

  release:
    name: publish GitHub release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      # Where the release goes: this repository unless vars.NOD_RELEASE_REPO names another one
      # (then secrets.NOD_RELEASE_TOKEN needs contents:write on it).
      RELEASE_REPO: ${{ vars.NOD_RELEASE_REPO || github.repository }}
      GH_TOKEN: ${{ secrets.NOD_RELEASE_TOKEN || github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: publish-*
          path: parts

      # Each macOS leg writes its own half (`mac.arm64` / `mac.x86_64`); the Windows/Linux legs carry
      # the runtime's artifacts and no manifest. They coexist, so a recursive merge gives the one
      # manifest the macOS updater and the Homebrew cask read. The top-level `url`/`sha256` stay the
      # arm64 zip: that is what a reader from before the `mac` block installs.
      - name: merge manifests and collect artifacts
        run: |
          mkdir -p out
          shopt -s nullglob
          manifests=(parts/*/manifest.json)
          if [ ${#manifests[@]} -eq 0 ]; then
            echo "::error::no macOS manifest halves were published"
            exit 1
          fi
          versions=$(jq -s '[.[].version] | unique | length' "${manifests[@]}")
          [ "$versions" = 1 ] || { echo "::error::manifests disagree on version"; jq -s '[.[].version]' "${manifests[@]}"; exit 1; }
          jq -s 'reduce .[] as $m ({}; . * $m) | .url = .mac.arm64.url | .sha256 = .mac.arm64.sha256' \
            "${manifests[@]}" > out/manifest.json
          jq -e '.mac.arm64.url and .mac.arm64.sha256 and .mac.x86_64.url and .mac.x86_64.sha256' out/manifest.json > /dev/null \
            || { echo "::error::manifest.json is missing a macOS architecture"; exit 1; }
          find parts -type f ! -name manifest.json -exec cp -n {} out/ \;
          ls -la out
          {
            echo "### Nod $VERSION"
            echo
            echo '```json'
            jq 'del(.notes)' out/manifest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: check update url
        run: |
          url=$(jq -r '.url // empty' out/manifest.json)
          case "$url" in
            https://github.com/$RELEASE_REPO/releases/latest/download/*) ;;
            *) echo "::warning::download urls ($url) don't point at $RELEASE_REPO latest release; set the seed's update.url to https://github.com/$RELEASE_REPO/releases/latest/download/manifest.json for auto-update from GitHub Releases" ;;
          esac

      - name: create or update release
        run: |
          notes="$RUNNER_TEMP/notes.md"
          jq -r '.notes // empty' out/manifest.json > "$notes"
          if gh release view "$TAG" --repo "$RELEASE_REPO" > /dev/null 2>&1; then
            echo "::warning::release $TAG already exists: assets replaced. Installed apps only auto-update when app.json version goes up."
            gh release upload "$TAG" out/* --repo "$RELEASE_REPO" --clobber
            gh release edit "$TAG" --repo "$RELEASE_REPO" --notes-file "$notes" --latest
          else
            target=()
            [ "$RELEASE_REPO" = "${{ github.repository }}" ] && target=(--target "${{ github.sha }}")
            gh release create "$TAG" out/* --repo "$RELEASE_REPO" "${target[@]}" \
              --title "Nod $VERSION" \
              --notes-file "$notes" \
              --latest
          fi

  # The Homebrew cask (`Casks/nod.rb`, this repository is the tap — docs/distribuicao.md §3.1)
  # names the release just published, with the sha256 its manifest carries for each macOS zip. It
  # is committed to `main`, which every `release-*` branch starts from; a re-run of an older release
  # leaves a newer cask alone (`scripts/brew-cask.ts`). A push by GITHUB_TOKEN starts no workflow.
  cask:
    name: update the Homebrew cask
    needs: [prepare, release]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_REPO: ${{ vars.NOD_RELEASE_REPO || github.repository }}
      GH_TOKEN: ${{ secrets.NOD_RELEASE_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: write Casks/nod.rb
        run: |
          gh release download "$TAG" --repo "$RELEASE_REPO" --pattern manifest.json --dir "$RUNNER_TEMP"
          bun scripts/brew-cask.ts "$RUNNER_TEMP/manifest.json" --repo="$RELEASE_REPO"

      - name: commit to main
        run: |
          if git diff --quiet -- Casks/nod.rb && git ls-files --error-unmatch Casks/nod.rb > /dev/null 2>&1; then
            echo "Casks/nod.rb unchanged"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898699+github-actions[bot]@users.noreply.github.com'
          git add Casks/nod.rb
          git commit -m "Casks/nod.rb: Nod $VERSION"
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          echo "::error::could not push Casks/nod.rb to main"
          exit 1
