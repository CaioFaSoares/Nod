# Builds Nod for every OS and publishes the zips + auto-update manifest as a GitHub Release
# whenever a branch named release-* is pushed. macOS ships the Electrobun target, Windows and Linux
# the tinyjs one — one release, one `manifest.json` every reader understands. Process and caveats:
# docs/distribuicao.md §8 and §10.
name: release

on:
  push:
    branches: ['release-*']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Pinned runtime (docs/canonico.md §19: TINYJS_VERSION fixed per release).
  TINYJS_VERSION: v0.57.2
  BUN_VERSION: 1.4.3

jobs:
  prepare:
    name: check version and tests
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - id: version
        name: read version
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          version=$(jq -r '.version' tinyjs.base.json)
          # semver, plus hotfix letters right after the patch: 0.5.5a, 0.5.5b (docs/distribuicao.md §8).
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+[a-z]*([-+].*)?$ ]]; then
            echo "::error file=tinyjs.base.json::version '$version' is not X.Y.Z or X.Y.Z<letters> (a hotfix, as in 0.5.5a)"
            exit 1
          fi
          # release-1.2.3 (or release-1.2.3a) must match tinyjs.base.json; other release-* names skip the check.
          suffix="${BRANCH#release-}"
          if [[ "$suffix" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+ ]] && [[ "${suffix#v}" != "$version" ]]; then
            echo "::error file=tinyjs.base.json::branch $BRANCH says ${suffix#v} but tinyjs.base.json says $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The tag carries the release prefix (docs/canonico.md §19: versions follow `release-*`).
          echo "tag=release-$version" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: host
      # The Electrobun project is typechecked where the devkit exists: after `eb:build` (the CLI
      # projects it) on the macOS legs. Here the devkit is absent, so `typecheck` would refuse in CI.
      - run: bun run typecheck:app
      - run: bun test test/

  build:
    name: build ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      # Every leg runs to the end so one failure does not hide another; the release job still needs
      # all of them.
      fail-fast: false
      matrix:
        include:
          # Apple silicon: the Electrobun target (`app` is Electrobun's own directory name).
          - { target: macos-arm64, os: macos-15, arch: arm64, app: stable-macos-arm64, runtime: electrobun }
          # Intel Macs: the tinyjs build of the same code. Electrobun 2.0.4 publishes no darwin-x64
          # core or Hutch (release v2.0.4 assets; the first 0.7.0 run failed with "release manifest
          # is incomplete for macos-x64"), so Intel stays on tinyjs, as Windows/Linux do.
          - { target: macos-x86_64, os: macos-15, arch: x86_64, runtime: tinyjs }
          # Windows/Linux: the tinyjs build of the same code.
          - { target: linux-x86_64, os: ubuntu-24.04, runtime: tinyjs }
          - { target: linux-arm64, os: ubuntu-24.04-arm, runtime: tinyjs }
          - { target: windows, os: windows-2025, runtime: tinyjs }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          # The notes step looks back for the `Release <version>:` commit (see below).
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: install WebKitGTK (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-0

      - name: install tinyjs (macOS, Linux)
        if: matrix.runtime == 'tinyjs' && runner.os != 'Windows'
        run: |
          curl -fsSL https://tinyjs.app/install | TINYJS_NO_MODIFY_PATH=1 sh
          echo "$HOME/.tinyjs" >> "$GITHUB_PATH"

      - name: install tinyjs (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://tinyjs.app/install.ps1 | iex
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:LOCALAPPDATA 'tinyjs')

      - run: bun install --frozen-lockfile

      # The private seed (and any icon it references) never enters git (AGENTS.md). It arrives as
      # the NOD_PRIVATE_RESOURCES secret: base64 of a tar.gz whose paths are relative to resources/.
      - name: restore private resources
        env:
          NOD_PRIVATE_RESOURCES: ${{ secrets.NOD_PRIVATE_RESOURCES }}
        run: |
          if [ -z "$NOD_PRIVATE_RESOURCES" ]; then
            echo "::error::secret NOD_PRIVATE_RESOURCES is missing (docs/distribuicao.md §8)"
            exit 1
          fi
          printf '%s' "$NOD_PRIVATE_RESOURCES" | base64 -d | tar -xzf - -C resources
          test -f resources/seed.json || { echo "::error::NOD_PRIVATE_RESOURCES has no seed.json"; exit 1; }
          # RF-56: an `icon.png` in the same tarball is the custom app icon; without one the release
          # wears the tracked assets/icon.png (docs/distribuicao.md §9).
          if [ -f resources/icon.png ]; then
            echo "app icon: resources/icon.png (custom, from NOD_PRIVATE_RESOURCES)"
          else
            echo "app icon: assets/icon.png (tracked default)"
          fi

      # tinyjs legs only: Electrobun generates its own config (and picks the icon) below.
      - name: generate tinyjs.json
        if: matrix.runtime == 'tinyjs'
        run: |
          bun scripts/gen-config.ts build
          # RF-56: gen-config picks the private icon on its own; a release wearing the wrong icon is
          # worse than a failed build, so say which one and refuse the mismatch.
          icon=$(bun -e 'console.log(JSON.parse(await Bun.file("tinyjs.json").text()).icon ?? "none")')
          echo "tinyjs.json icon: $icon"
          if [ -f resources/icon.png ] && [ "$icon" != "resources/icon.png" ]; then
            echo "::error::NOD_PRIVATE_RESOURCES carries icon.png but the build would use $icon"
            exit 1
          fi

      # RF-56 for the Electrobun target: the private icon from NOD_PRIVATE_RESOURCES has to be the
      # one the bundle wears. `dev` on purpose — the icon choice is the same in both modes, and
      # `build` refuses to generate before `bun run build` writes `dist/`. This only writes
      # `electrobun.config.ts`; `eb:build` regenerates it for the build right after.
      # `build.win.icon` is the resolved PNG (macOS names the iconset generated from it).
      - name: check the app icon (Electrobun)
        if: matrix.runtime == 'electrobun'
        run: |
          bun scripts/gen-electrobun-config.ts dev
          icon=$(bun -e 'const { default: config } = await import("./electrobun.config.ts"); console.log(config.build.win?.icon ?? "none")')
          echo "electrobun.config.ts icon: $icon"
          if [ -f resources/icon.png ] && [ "$icon" != "resources/icon.png" ]; then
            echo "::error::NOD_PRIVATE_RESOURCES carries icon.png but the build would use $icon"
            exit 1
          fi

      # The Electrobun CLI resolves its pinned Hutch SDK on first use (~/.hutch) and projects it into
      # .hutch/devkit; the build writes build/stable-macos-<arch>/ and artifacts/. `copland.nod` is
      # the identifier the tinyjs builds wear, so an update from 0.6.0c keeps the same app data —
      # and the same identity the facade checks before it swaps a staged bundle in.
      - name: build the Electrobun target
        if: matrix.runtime == 'electrobun'
        run: NOD_APP_ID=copland.nod bun run eb:build

      # Now that the devkit is projected, the Electrobun project is typechecked for real. Only that
      # project: `prepare` already checked the page, backend and host (this leg never installs the
      # host's dependencies).
      - name: typecheck (Electrobun project)
        if: matrix.runtime == 'electrobun'
        run: bunx tsc -p electrobun/tsconfig.json --noEmit

      # Camera/microphone are gated by the two usage strings in the plist the app runs with. `eb:build`
      # asserts them, and this step keeps the contract visible before anything is published: hutch
      # packs the payload tar before `postWrap`, so a regression there must fail the release.
      - name: assert the macOS usage strings in the shipped bundle
        if: matrix.runtime == 'electrobun'
        run: bun run eb:verify

      # The tinyjs updater on users' machines refuses to swap in a bundle that fails this check, so
      # a release that fails it would be invisible to every installed Nod. Fail here instead.
      - name: verify the shipped signature
        if: matrix.runtime == 'electrobun'
        run: codesign --verify --strict --deep "build/${{ matrix.app }}/Nod.app"

      # The notes are the body of the `Release <version>:` commit — what installed Nods show in the
      # update notice (RF-55). A merge commit (`Merge pull request #…`) or a dispatched run (no
      # head_commit, the case of release-branch.yml) would otherwise publish a header or nothing.
      - name: release notes
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          # `--no-merges`: a merge commit's body is the PR title (`Release X — …`), which would match
          # first and publish one line instead of the notes (it did, on release-0.5.0).
          pattern="^Release ${VERSION//./\\.}:"
          notes=$(git log -1 --no-merges --extended-regexp --grep="$pattern" --format=%B)
          [ -n "$notes" ] || notes="$MESSAGE"
          [ -n "$notes" ] || notes=$(git log -1 --format=%B)
          # GitHub's merge header (and the blank line after it) is not news for anyone.
          notes=$(printf '%s\n' "$notes" | sed '/^Merge pull request #/,/^$/d')
          printf '%s\n' "${notes:-Nod $VERSION}" > "${{ runner.temp }}/release-notes.md"

      # One macOS half of the release manifest: `nod-<v>-macos-<arch>.zip` (the name the tinyjs
      # publish uses) and its `mac.<arch>` entry. The release job merges the two halves with the
      # Windows/Linux ones.
      - name: publish the macOS half (Electrobun)
        if: matrix.runtime == 'electrobun'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          bun scripts/eb-publish.ts build \
            --arch "${{ matrix.arch }}" \
            --version "$VERSION" \
            --base-url "https://github.com/${{ vars.NOD_RELEASE_REPO || github.repository }}/releases/latest/download" \
            --notes-file "${{ runner.temp }}/release-notes.md" \
            --out dist/publish

      - name: publish (macOS Intel, tinyjs)
        if: matrix.runtime == 'tinyjs' && runner.os == 'macOS'
        run: |
          tinyjs version
          tinyjs publish --arch "${{ matrix.arch }}" --notes-file "${{ runner.temp }}/release-notes.md"

      - name: publish (Linux)
        if: runner.os == 'Linux'
        run: |
          tinyjs version
          tinyjs publish --notes-file "${{ runner.temp }}/release-notes.md"

      - name: publish (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          tinyjs version
          tinyjs publish --notes-file "${{ runner.temp }}/release-notes.md"

      - name: check manifest version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          got=$(bun -e 'console.log(JSON.parse(await Bun.file("dist/publish/manifest.json").text()).version)')
          [ "$got" = "$VERSION" ] || { echo "::error::manifest says $got, expected $VERSION"; exit 1; }
          ls -la dist/publish

      - uses: actions/upload-artifact@v7
        with:
          name: publish-${{ matrix.target }}
          path: dist/publish/
          if-no-files-found: error
          retention-days: 3

  release:
    name: publish GitHub release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      # Where the release goes: this repository unless vars.NOD_RELEASE_REPO names another one
      # (then secrets.NOD_RELEASE_TOKEN needs contents:write on it).
      RELEASE_REPO: ${{ vars.NOD_RELEASE_REPO || github.repository }}
      GH_TOKEN: ${{ secrets.NOD_RELEASE_TOKEN || github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: publish-*
          path: parts

      # Each runner writes its own half: the Apple silicon leg the Electrobun `mac.arm64` block, the
      # Intel leg the tinyjs `mac.x86_64` block, Linux `linux.<arch>` and Windows `win`. They coexist,
      # so a recursive merge gives the one manifest every OS reads. The top-level `url`/`sha256` stay
      # the arm64 zip: that is what a tinyjs reader from before the `mac` block installs.
      - name: merge manifests
        run: |
          mkdir -p out
          versions=$(jq -s '[.[].version] | unique | length' parts/*/manifest.json)
          [ "$versions" = 1 ] || { echo "::error::manifests disagree on version"; jq -s '[.[].version]' parts/*/manifest.json; exit 1; }
          jq -s 'reduce .[] as $m ({}; . * $m) | .url = .mac.arm64.url | .sha256 = .mac.arm64.sha256' \
            parts/*/manifest.json > out/manifest.json
          jq -e '.mac.arm64.url and .mac.arm64.sha256 and .mac.x86_64.url and .mac.x86_64.sha256' out/manifest.json > /dev/null \
            || { echo "::error::manifest.json is missing a macOS architecture"; exit 1; }
          find parts -type f ! -name manifest.json -exec cp {} out/ \;
          ls -la out
          {
            echo "### Nod $VERSION"
            echo
            echo '```json'
            jq 'del(.notes)' out/manifest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: check update url
        run: |
          expected="https://github.com/$RELEASE_REPO/releases/latest/download/manifest.json"
          url=$(jq -r '.url // empty' out/manifest.json)
          case "$url" in
            https://github.com/$RELEASE_REPO/releases/latest/download/*) ;;
            *) echo "::warning::download urls ($url) don't point at $RELEASE_REPO latest release; set the seed's update.url to $expected for auto-update from GitHub Releases" ;;
          esac

      - name: create or update release
        run: |
          if gh release view "$TAG" --repo "$RELEASE_REPO" > /dev/null 2>&1; then
            echo "::warning::release $TAG already exists: assets replaced. Installed apps only auto-update when tinyjs.base.json version goes up."
            gh release upload "$TAG" out/* --repo "$RELEASE_REPO" --clobber
            gh release edit "$TAG" --repo "$RELEASE_REPO" --notes-file <(jq -r '.notes // empty' out/manifest.json) --latest
          else
            target=()
            [ "$RELEASE_REPO" = "${{ github.repository }}" ] && target=(--target "${{ github.sha }}")
            gh release create "$TAG" out/* --repo "$RELEASE_REPO" "${target[@]}" \
              --title "Nod $VERSION" \
              --notes-file <(jq -r '.notes // empty' out/manifest.json) \
              --latest
          fi

  # The Homebrew cask (`Casks/nod.rb`, this repository is the tap — docs/distribuicao.md §3.1)
  # names the release just published, with the sha256 its manifest carries for each macOS zip. It
  # is committed to `main`, which every `release-*` branch starts from; a re-run of an older release
  # leaves a newer cask alone (`scripts/brew-cask.ts`). A push by GITHUB_TOKEN starts no workflow.
  cask:
    name: update the Homebrew cask
    needs: [prepare, release]
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_REPO: ${{ vars.NOD_RELEASE_REPO || github.repository }}
      GH_TOKEN: ${{ secrets.NOD_RELEASE_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: write Casks/nod.rb
        run: |
          gh release download "$TAG" --repo "$RELEASE_REPO" --pattern manifest.json --dir "$RUNNER_TEMP"
          bun scripts/brew-cask.ts "$RUNNER_TEMP/manifest.json" --repo="$RELEASE_REPO"

      - name: commit to main
        run: |
          if git diff --quiet -- Casks/nod.rb && git ls-files --error-unmatch Casks/nod.rb > /dev/null 2>&1; then
            echo "Casks/nod.rb unchanged"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898699+github-actions[bot]@users.noreply.github.com'
          git add Casks/nod.rb
          git commit -m "Casks/nod.rb: Nod $VERSION"
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          echo "::error::could not push Casks/nod.rb to main"
          exit 1
