<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nod — connected smoke (two instances)</title>
  </head>
  <body>
    <pre id="log">Nod connected smoke: waiting for the runtime…</pre>
    <script>
      // Test page for the two-instance smoke (SP05 §5). Plain JavaScript, no bundler.
      // This file is a TEMPLATE: test/smoke/connected.ts replaces its one config marker with the
      // JSON of the launch { phase, nonce, address, guild, desk, originA, originB, originC,
      // adminEmail, personEmail, otherEmail, methods, secrets, notes, guildIcon } and writes the
      // result to the app store (tiny.store.set), which the runner reads at <app data>/store.json.
      //
      // The page drives the API through the real path (tiny.api.call), phase by phase:
      //
      //   admin-publish      SP05 §5.2  a local account with the guild email first, and a credential
      //                                 saved for it; then the setup code, which collides with that
      //                                 account and answers F1's choice — adopted, the same code
      //                                 redeems and the saved credential comes along; publish the
      //                                 local tools, create P and Q with role `team`, grant both
      //                                 tools to `team`, the admin joins `team` too (a `role` share
      //                                 needs a role in common), sync; hand both codes over
      //                      B7/SP04 §2  a personal tool of the admin's own and its favorite: the
      //                                 sync is what takes them up to the host
      //                      K1/SP06 §2  this machine's own key pair, reported to the desk (a public
      //                                 fingerprint) for the second machine to compare
      //                      SP05 §6    and upload the guild's PNG (host.setGuildIcon)
      //   person-join        SP05 §5.3  P activates, the granted tool appears (it is the host's
      //                     SP05 §5.5  entry: P's own seed has no row for it), the vault fills on
      //                                 its origin; host stopped: lock/unlock, tools from the cache,
      //                                 `stale`; host restarted: the events go up
      //                      SP05 §6    and this machine reports the guild icon as available and
      //                                 shows it (nod.appIcon, nod.setAppIcon); the PNG itself is the
      //                                 runner's check, read off P's data dir after the phase
      //                      B7/K1       no personal half of another person arrives, and P's own
      //                                 pair is reported to the desk for the admin to pin
      //   person2-join       SP05 §5.3  Q — the second member of `team` — activates the same way
      //   admin-clear        SP05 §6    the admin removes the guild icon
      //   person-cleared     SP05 §6    P's next sync deletes the file and drops the guild option
      //   admin-share        K2/K4/K6   both members pinned with the fingerprints they reported, the
      //                                 personal tool and the favorite read back out of the snapshot;
      //                                 a credential of the granted tool saved, scoped `role` and
      //                                 sent to both members; a second one assigned to `team` (K8)
      //   person-share       K4/K7      P's inbox holds the send and the assign; the send is
      //                                 accepted behind the gate, `vault.reveal` gives the sender's
      //                                 value back and the holders list both people
      //   person2-accept     K4         Q accepts the same two shares and reveals the same value
      //   admin-update       K9         the owner saves a new secret, which fans an update out
      //   person-update      K9         P's next sync applies it with no gate and the vault moves
      //   admin-rotate       K9/RF-48   the admin revokes P as a holder (`rotationPending`), then
      //                                 saves: the update reaches Q and the state clears
      //   admin-second-      B7/K1      the same person's second machine signs in, ends with the pair
      //     machine                     of the first one and finds the personal tool in the snapshot
      //   admin-revoke       SP05 §5.4  the admin revokes P
      //   person-signed-out  SP05 §5.4  P's next sync: `signed-out`, the org tools gone
      //
      // No code, token or password is ever printed: the invite codes arrive over the runner's desk
      // (loopback) and the password is this page's own constant, never echoed. Every gated call
      // carries that password: the backend takes it because this run is a non-release dev one
      // (`tinyjs dev`), the only case where a typed password is a factor on a machine that also has
      // `app.authenticate` (SP02 §9, canonico §22) — the operating system's prompt would otherwise
      // be what runs, with nobody to answer it.
      (async function () {
        'use strict';

        const CONFIG = __CONFIG__;

        /** The password this smoke sets for every account. Not a secret: it guards throwaway app
         *  data dirs under the smoke's own ids, and it never leaves this page. */
        const ACCOUNT_PASSWORD = 'smoke-connected-1';

        /** The credential values the sharing steps write (SP06 §6): the runner's config carries the
         *  username and the prefix, so the dump of `host.db` is asked for exactly what this page
         *  saved. Not secrets either — throwaway values of throwaway keychains, compared and never
         *  printed. */
        const LOCAL_SECRET = CONFIG.secrets.local;
        const SHARE_USERNAME = CONFIG.secrets.username;
        const SHARED_1 = CONFIG.secrets.shared + '-1';
        const SHARED_2 = CONFIG.secrets.shared + '-2';
        const SHARED_3 = CONFIG.secrets.shared + '-3';
        const ASSIGNED_SECRET = CONFIG.secrets.shared + '-b';

        /** B7: the personal tool the admin adds, which its own second machine must find. */
        const PERSONAL_TOOL_TITLE = 'Mine (smoke)';

        /**
         * 0.4.5 (RF-60): an unlock with no `target` is the Offline tile's session — the local
         * catalog, no host call, the guild disconnected. Every unlock of this smoke is the guild
         * person of this machine, so the target travels with all of them; 5.5's "offline" is the
         * host process being down, which is not the same thing (the cache still serves the guild).
         */
        const GUILD_TARGET = { kind: 'guild', id: CONFIG.address };

        const TINY_WAIT_MS = 30000;
        const STATE_TIMEOUT_MS = 20000;
        const POLL_INTERVAL_MS = 200;

        const log = document.getElementById('log');
        const steps = [];

        /** What one phase carries from its own steps to the next one (never a code or a secret). */
        const shared = {
          fingerprint: null,
          /** The setup code of the admin phase and the invite codes of the person phases: held in
           *  memory only, cleared as soon as the call that spends it returns. */
          setupCode: null,
          personCode: null,
          otherCode: null,
          toolId: null,
          personId: null,
          /** F1: the local account of the admin Nod before the join, and the credential it saved. */
          localPersonId: null,
          localToolId: null,
          /** The guild person id the local account became, and this machine's own person id. */
          guildPersonId: null,
          meId: null,
          /** K4/K6: the second granted tool, the personal tool, and the two shares of one phase. */
          toolBId: null,
          personalToolId: null,
          shareId: null,
          assignId: null,
          sharedToolId: null,
          assignedToolId: null,
          /** K1/K2: the two members of `team` on the roster, as the admin's phase reads them. */
          otherPersonId: null,
        };

        function sleep(ms) {
          return new Promise((resolve) => setTimeout(resolve, ms));
        }

        function message(error) {
          if (error instanceof Error) return error.message;
          if (typeof error === 'string') return error;
          return 'unknown error';
        }

        function expect(condition, text) {
          if (!condition) throw new Error(text);
        }

        function call(method, params) {
          return window.tiny.api.call(method, params || {});
        }

        function summarize(value) {
          try {
            return JSON.stringify(value).slice(0, 400);
          } catch (error) {
            return String(value);
          }
        }

        function record(step, ok, detail, ms) {
          steps.push({
            step: step,
            ok: !!ok,
            detail: String(detail === null || detail === undefined ? '' : detail),
            ms: Math.max(0, Math.round(ms || 0)),
          });
          log.textContent = steps
            .map((s) => (s.ok ? 'ok ' : 'FAILED ') + s.step + ' (' + s.ms + ' ms) ' + s.detail)
            .join('\n');
        }

        // The result also carries the phase and the nonce of this launch: the runner launches the
        // same app id more than once, and the nonce is what tells a fresh result from the previous
        // one still sitting in store.json.
        async function writeResult(done, error) {
          try {
            await window.tiny.store.set('smoke_result', {
              done: !!done,
              phase: CONFIG.phase,
              nonce: CONFIG.nonce,
              steps: steps,
              error: error || null,
            });
          } catch (e) {
            /* without the store there is no result; the runner falls back to the timeout */
          }
        }

        async function waitUntil(read, accept, timeoutMs, summary) {
          const start = Date.now();
          let last = null;
          for (;;) {
            last = await read();
            if (accept(last)) return last;
            if (Date.now() - start > timeoutMs) {
              throw new Error(
                'timeout (' + timeoutMs + ' ms); last state: ' + (summary ? summary(last) : summarize(last)),
              );
            }
            await sleep(POLL_INTERVAL_MS);
          }
        }

        async function waitForTiny() {
          const start = Date.now();
          while (!window.tiny) {
            if (Date.now() - start > TINY_WAIT_MS) {
              throw new Error('the tiny global did not show up in ' + TINY_WAIT_MS + ' ms');
            }
            await sleep(100);
          }
        }

        /**
         * The desk: the runner's loopback endpoint. It holds the host's setup code (the terminal
         * that started the host), receives the invite code of each member from this page (the
         * admin's chat) and switches the host process off and on (SP05 §5.5). Nothing here goes
         * through a file.
         */
        async function desk(path, body) {
          const init =
            body === undefined
              ? undefined
              : {
                  method: 'POST',
                  headers: { 'content-type': 'application/json' },
                  body: JSON.stringify(body),
                };
          const response = await window.tiny.fetch(CONFIG.desk + path, init);
          let payload = null;
          try {
            payload = await response.json();
          } catch (error) {
            payload = null;
          }
          if (!response.ok || payload === null || payload.ok !== true) {
            const why = payload && payload.error ? String(payload.error) : 'status ' + response.status;
            throw new Error('desk ' + path + ' refused: ' + why);
          }
          return payload;
        }

        /** The origin of an entry's url — the same normalization the vault applies (RF-38). */
        function originOf(url) {
          try {
            return new URL(url).origin;
          } catch (error) {
            return null;
          }
        }

        /** The catalog entry of one fake tool, whatever id the seed and the host gave it. */
        function entryOfOrigin(list, origin) {
          return (list || []).find((entry) => originOf(entry.url) === origin) || null;
        }

        function toolLabel(entry) {
          return entry === null
            ? 'absent'
            : entry.id +
                ' (roles ' +
                summarize(entry.roles) +
                ', ' +
                (entry.views || []).length +
                ' view(s))';
        }

        /** One credential of a `vault.list` answer, or null when there is none for that tool. */
        function vaultItemOf(items, toolId) {
          return (items || []).find((item) => item.toolId === toolId) || null;
        }

        /**
         * K1/K2: this machine's own key pair, reported to the desk under one note key. A fingerprint
         * is a digest of two public keys — the one thing another machine needs to tell "the same
         * pair" from "another one" — and no secret ever goes through the desk.
         */
        async function reportOwnFingerprint(note) {
          const mine = await call('keys.mine');
          expect(
            !!mine && typeof mine.fingerprint === 'string' && mine.fingerprint.length > 0,
            'keys.mine answered ' + summarize(mine),
          );
          await desk('/desk/note', { key: note, value: mine.fingerprint });
          return mine.fingerprint;
        }

        /**
         * The ids one admin phase needs: the two org tools by the origin of their fake server, and
         * the three people by email. A phase is its own launch, so nothing carries over from the
         * one before it — what is stable is the host's data.
         */
        async function adminIds() {
          const list = await call('catalog.list');
          const toolA = entryOfOrigin(list, CONFIG.originA);
          const toolB = entryOfOrigin(list, CONFIG.originB);
          expect(toolA !== null && toolB !== null, 'an org tool left the catalog (' + list.length + ' entries)');
          const people = await call('people.list');
          const me = people.find((item) => item.email === CONFIG.adminEmail) || null;
          const person = people.find((item) => item.email === CONFIG.personEmail) || null;
          const other = people.find((item) => item.email === CONFIG.otherEmail) || null;
          expect(me !== null, 'the admin is not a person of the guild');
          expect(person !== null && other !== null, 'a member of `team` is missing from the roster');
          return { toolA, toolB, me, person, other };
        }

        // ------------------------------------------------------------------ SP05 §5.2 — the admin

        async function stepStateFresh() {
          const state = await call('session.state');
          expect(state.hasAccount === false, 'hasAccount = ' + JSON.stringify(state.hasAccount));
          expect(state.unlocked === false, 'unlocked = ' + JSON.stringify(state.unlocked));
          return 'no account and locked';
        }

        /**
         * F1: the admin's Nod is not a blank machine — it already has a local account with the very
         * email the setup code will claim. Creating it here is what makes the join answer the choice
         * instead of adopting without asking.
         */
        async function stepLocalAccount() {
          const state = await call('session.createAccount', {
            email: CONFIG.adminEmail,
            name: 'Smoke Admin',
            password: ACCOUNT_PASSWORD,
          });
          expect(state.hasAccount === true, 'hasAccount = ' + JSON.stringify(state.hasAccount));
          expect(state.unlocked === true, 'unlocked = ' + JSON.stringify(state.unlocked));
          expect(!!state.person, 'no person came back: ' + summarize(state.person));
          shared.localPersonId = state.person.id;
          return 'a local account with the guild email exists and is unlocked (' + state.person.id + ')';
        }

        /** F1: a credential saved before the join, which the adoption has to bring along. */
        async function stepLocalVault() {
          const list = await call('catalog.list');
          const entry = entryOfOrigin(list, CONFIG.originA);
          expect(entry !== null, 'Tool A is not in the local catalog (' + list.length + ' entries)');
          await call('vault.save', { toolId: entry.id, username: 'smoke', secret: LOCAL_SECRET });
          const items = await call('vault.list');
          expect(
            items.some((item) => item.toolId === entry.id),
            'the credential is not in the vault index',
          );
          shared.localToolId = entry.id;
          return 'credential saved for ' + entry.id + ' before the join (value only in the keychain)';
        }

        async function stepSetupCode() {
          const from = await desk('/desk/admin');
          expect(from.guild === CONFIG.guild, 'the desk guild = ' + JSON.stringify(from.guild));
          expect(typeof from.code === 'string' && from.code.length > 0, 'the desk carries no setup code');
          expect(from.address === CONFIG.address, 'the desk address is not this host');
          shared.setupCode = from.code;
          return 'setup code in memory (not printed)';
        }

        async function stepDiscover() {
          const found = await call('host.discover', { address: CONFIG.address });
          expect(found.guild === CONFIG.guild, 'guild = ' + JSON.stringify(found.guild));
          expect(
            typeof found.fingerprint === 'string' && found.fingerprint.length > 0,
            'fingerprint = ' + JSON.stringify(found.fingerprint),
          );
          shared.fingerprint = found.fingerprint;
          return 'guild ' + found.guild + ', fingerprint ' + found.fingerprint.length + ' chars';
        }

        /**
         * F1: the setup code against a Nod that already holds that email. The join answers the
         * choice — `local-account` — **before any host call**, so the single-use setup code is not
         * spent deciding; the next step is the one that redeems it.
         */
        async function stepActivateChoice() {
          const answer = await call('host.activate', {
            address: CONFIG.address,
            fingerprint: shared.fingerprint,
            email: CONFIG.adminEmail,
            code: shared.setupCode,
            password: ACCOUNT_PASSWORD,
            name: 'Smoke Admin',
          });
          expect(answer && answer.kind === 'local-account', 'host.activate answered ' + summarize(answer));
          expect(answer.email === CONFIG.adminEmail, 'the choice names ' + JSON.stringify(answer.email));
          expect(
            answer.personId === shared.localPersonId,
            'the choice names another account: ' + summarize(answer.personId),
          );
          return 'the join asked which account wins (the local one), and nothing was sent';
        }

        async function stepActivateAdmin() {
          const answer = await call('host.activate', {
            address: CONFIG.address,
            fingerprint: shared.fingerprint,
            email: CONFIG.adminEmail,
            code: shared.setupCode,
            password: ACCOUNT_PASSWORD,
            name: 'Smoke Admin',
            adoptLocal: true,
          });
          shared.setupCode = null;
          expect(answer && answer.kind === 'session', 'host.activate answered ' + summarize(answer));
          const state = answer.session;
          expect(state.unlocked === true, 'unlocked = ' + JSON.stringify(state.unlocked));
          expect(
            !!state.person && state.person.admin === true,
            'person.admin = ' + JSON.stringify(state.person && state.person.admin),
          );
          expect(
            state.person.id !== shared.localPersonId,
            'the account kept its local id: the adoption did not happen',
          );
          shared.guildPersonId = state.person.id;
          return 'activated with the setup code, adopting the local account; the session is unlocked and the person is admin';
        }

        /**
         * F1 on the real surface: the credential saved before the join is still there, under the
         * guild's person id — the keychain key was renamed with the account, and the vault opens it.
         */
        async function stepCredentialCameAlong() {
          const items = await call('vault.list');
          const item = items.find((entry) => entry.toolId === shared.localToolId) || null;
          expect(item !== null, 'the credential left the vault (' + summarize(items.map((i) => i.toolId)) + ')');
          expect(
            item.personId === shared.guildPersonId,
            'the item belongs to ' + summarize(item.personId) + ', not to the guild person',
          );
          expect(
            item.keychainKey === 'nod.cred.' + shared.guildPersonId + '.' + shared.localToolId,
            'the keychain key is ' + summarize(item.keychainKey),
          );
          const revealed = await call('vault.reveal', {
            toolId: shared.localToolId,
            password: ACCOUNT_PASSWORD,
          });
          expect(
            !!revealed && revealed.secret === LOCAL_SECRET,
            'revealing the credential came back as ' + summarize(revealed && revealed.username),
          );
          return 'the credential saved before the join reads back under the guild person id';
        }

        async function stepSyncConnected() {
          const state = await call('host.syncNow');
          expect(state.status === 'connected', 'host.state.status = ' + JSON.stringify(state.status));
          expect(state.guild === CONFIG.guild, 'guild = ' + JSON.stringify(state.guild));
          return (
            'status connected, guild ' + state.guild + ', pending writes ' + JSON.stringify(state.pendingWrites)
          );
        }

        async function stepPublish() {
          const method = CONFIG.methods.publish;
          if (method === null) {
            throw new Error(
              'ApiContract declares no bootstrap/publish method yet (B6 #18 / B8a #19 are not in this tree)',
            );
          }
          let result;
          let how = 'no arguments';
          if (CONFIG.methods.publishBody) {
            // A body-taking variant mirrors SP03 §2's BootstrapRequest; the page can only offer the
            // catalog it can read, which while connected is the snapshot's own (empty before this
            // write). The observation below says what came back either way.
            const entries = await call('catalog.list');
            const roles = await call('roles.list');
            result = await call(method, { tools: entries, roles: roles });
            how = 'BootstrapRequest body (' + entries.length + ' tool(s), ' + roles.length + ' role(s))';
          } else {
            result = await call(method, {});
          }
          const created = result && typeof result.created === 'number' ? result.created : null;
          expect(
            !(result && result.refused === true),
            method + ' refused the publish (the host already has org tools)',
          );
          expect(
            created === null || created > 0,
            method + ' created ' + JSON.stringify(created) + ' org tool(s)',
          );
          return method + ' with ' + how + '; answer ' + summarize(result);
        }

        async function stepCatalogPublished() {
          await call('host.syncNow');
          const list = await call('catalog.list');
          const entry = entryOfOrigin(list, CONFIG.originA);
          expect(entry !== null, 'Tool A is not in the catalog after publishing (' + list.length + ' entries)');
          shared.toolId = entry.id;
          return 'Tool A published as org tool ' + toolLabel(entry);
        }

        async function stepSaveTeam() {
          const role = await call('roles.save', { role: { id: 'team', name: 'Team', admin: false } });
          expect(role.id === 'team', 'role id = ' + JSON.stringify(role.id));
          return 'role team saved (admin ' + JSON.stringify(role.admin) + ')';
        }

        /**
         * 0.4.5 (RF-59): a person of the guild is created by redeeming an invite — the admin hands
         * one over, and whoever opens it creates the account they choose (the join of the person
         * phase below). The step keeps its place and its meaning: it is what hands P a way in.
         */
        async function stepCreatePerson() {
          const method = CONFIG.methods.inviteCreate;
          if (method === null) throw new Error('ApiContract declares no guild-invite method');
          const answer = await call(method, { roles: ['team'], maxUses: 1, expiresInMinutes: 1440 });
          expect(
            !!answer && typeof answer.code === 'string' && answer.code.length > 0,
            method + ' answered ' + summarize(answer),
          );
          if (CONFIG.methods.inviteCreateLink) {
            expect(
              typeof answer.link === 'string' && answer.link.indexOf('nod://join?') === 0,
              'the invite carries no nod://join link: ' + summarize(answer.link),
            );
          }
          shared.personCode = answer.code;
          return (
            method +
            " issued P's invite (role team, one use, a day; " +
            (CONFIG.methods.inviteCreateLink ? 'link + code not printed)' : 'code not printed)')
          );
        }

        /** The second member of `team`: the assignment seals to every member, and K9's revocation
         *  needs somebody left to rotate to. Its own invite, because each one has a single use. */
        async function stepCreateOther() {
          const method = CONFIG.methods.inviteCreate;
          if (method === null) throw new Error('ApiContract declares no guild-invite method');
          const answer = await call(method, { roles: ['team'], maxUses: 1, expiresInMinutes: 1440 });
          expect(
            !!answer && typeof answer.code === 'string' && answer.code.length > 0,
            method + ' answered ' + summarize(answer),
          );
          shared.otherCode = answer.code;
          return method + " issued the second member's invite (role team, one use; not printed)";
        }

        // The codes are handed over here, right after they exist: the person phases then fail for
        // their own reasons instead of for a missing hand-over.
        async function stepHandOver() {
          expect(typeof shared.personCode === 'string', 'no invite code was issued');
          await desk('/desk/handover', { code: shared.personCode, who: 'person' });
          shared.personCode = null;
          expect(typeof shared.otherCode === 'string', 'no invite code was issued for the second member');
          await desk('/desk/handover', { code: shared.otherCode, who: 'other' });
          shared.otherCode = null;
          return 'both invite codes handed over through the desk (not printed)';
        }

        /**
         * 0.4.5 (RF-59): an invite is not a person. The admin's two invites are on the host, and the
         * roster still holds nobody but the admin — P and Q come into being when each redeems their
         * own invite in their own phase (which `adminIds` then reads back, roles included).
         */
        async function stepPersonListed() {
          const people = await call('people.list');
          expect(Array.isArray(people), 'people.list returned ' + typeof people);
          const emails = people.map((item) => item.email);
          const me = people.find((item) => item.email === CONFIG.adminEmail) || null;
          expect(me !== null, 'the admin is not a person of the guild (' + summarize(emails) + ')');
          expect(
            !people.some((item) => item.email === CONFIG.personEmail) &&
              !people.some((item) => item.email === CONFIG.otherEmail),
            'an invite already created a person: ' + summarize(emails),
          );
          return (
            'the roster holds only the admin (' +
            people.length +
            ' person): an invite is not a person until it is redeemed'
          );
        }

        async function stepGrant() {
          expect(shared.toolId !== null, 'the tool was never published');
          const ok = await call('roles.grant', { roleId: 'team', toolId: shared.toolId, granted: true });
          expect(ok === true, 'roles.grant answered ' + summarize(ok));
          return 'Tool A granted to team';
        }

        async function stepGrantVisible() {
          const state = await call('host.syncNow');
          expect(state.status === 'connected', 'host.state.status = ' + JSON.stringify(state.status));
          const list = await call('catalog.list');
          const entry = entryOfOrigin(list, CONFIG.originA);
          expect(entry !== null, 'Tool A left the catalog after the grant');
          expect(
            (entry.roles || []).indexOf('team') !== -1,
            'the snapshot does not carry the grant: roles = ' + summarize(entry.roles),
          );
          return 'the snapshot carries the grant to team (' + toolLabel(entry) + ')';
        }

        /** The second org tool, granted to the same role: it is the credential K8 assigns. */
        async function stepGrantToolB() {
          const list = await call('catalog.list');
          const entry = entryOfOrigin(list, CONFIG.originB);
          expect(entry !== null, 'Tool B is not in the catalog (' + list.length + ' entries)');
          const ok = await call('roles.grant', { roleId: 'team', toolId: entry.id, granted: true });
          expect(ok === true, 'roles.grant answered ' + summarize(ok));
          shared.toolBId = entry.id;
          return 'Tool B (' + entry.id + ') granted to team';
        }

        /**
         * SP06 §5: a `role` share needs a role in common with the sender, so the admin joins `team`
         * as well — the guild's admin is a member of the team it shares with. The host writes the
         * row; the snapshot is what the scope decision reads.

        async function stepAdminJoinsTeam() {

          const people = await call('people.list');
          const me = people.find((item) => item.id === shared.guildPersonId) || null;
          expect(me !== null, 'the admin is not a person of the guild');
          const roles = (me.roles || []).slice();
          if (roles.indexOf('team') === -1) roles.push('team');
          const updated = await call('people.setRoles', { personId: me.id, roles });
          expect(
            (updated.roles || []).indexOf('team') !== -1,
            'the admin\'s roles are ' + summarize(updated.roles),
          );
          return 'the admin is in team too (' + (updated.roles || []).length + ' role(s))';

        /**

        // ------------------------------------------------------- SP05 §6 — the guild icon

        /** Twelve hex of a digest: enough to compare two of them by eye, and no secret. */
        function shortDigest(digest) {
          return String(digest).slice(0, 12) + '…';
        }

        /**
         * SP05 §6, SP03 §2: the admin uploads the guild's PNG. The host keeps the bytes and answers
         * their SHA-256 — the digest the next signed body carries (SP04 §2), and the one the runner
         * compares P's file against after its phase.
         */
        async function stepSetGuildIcon() {
          const answer = await call('host.setGuildIcon', { png: CONFIG.guildIcon.png });
          expect(
            !!answer && answer.sha256 === CONFIG.guildIcon.sha256,
            'host.setGuildIcon answered ' + summarize(answer),
          );
          return (
            'the host stored the PNG (' +
            CONFIG.guildIcon.png.length +
            ' base64url chars) and answered sha256 ' +
            shortDigest(answer.sha256)
          );
        }

        /** The digest travels inside the next signed body: this is the sync that brings it. */
        async function stepGuildIconSync() {
          const state = await call('host.syncNow');
          expect(state.status === 'connected', 'host.state.status = ' + JSON.stringify(state.status));
          return 'status connected; the signed body carries the icon digest';
        }

        /**
         * SP04 §2, this machine: the bytes come back on the sync that applied the digest, and are
         * kept only when they hash to it. `backend/main.ts` chains that fetch without awaiting it, so
         * this reads `nod.appIcon` until it lands.
         */
        async function stepPersonGuildIconAvailable() {
          const icon = await waitUntil(
            () => call('nod.appIcon'),
            (state) => state.guildIconAvailable === true,
            STATE_TIMEOUT_MS,
            (state) => 'guildIconAvailable = ' + JSON.stringify(state.guildIconAvailable),
          );
          return (
            'nod.appIcon reports guildIconAvailable true (choice ' + JSON.stringify(icon.choice) + ')'
          );
        }

          expect(chosen && chosen.choice === 'guild', 'nod.setAppIcon answered ' + summarize(chosen));
          const read = await call('nod.appIcon');
          expect(read.choice === 'guild', 'nod.appIcon reads back ' + summarize(read.choice));
          expect(
            read.guildIconAvailable === true,
            'guildIconAvailable = ' + JSON.stringify(read.guildIconAvailable),
          );
          return 'the choice is guild and it reads back: ' + summarize(read);
        }

        /** SP05 §6, SP03 §2: the guild has no icon again; the next body says `guildIcon: null`. */
        async function stepClearGuildIcon() {
          const ok = await call('host.clearGuildIcon');
          expect(ok === true, 'host.clearGuildIcon answered ' + summarize(ok));
          return 'the host dropped the icon; the next signed body says guildIcon null';
        }

        /**
         * SP04 §2/SP05 §6: the sync applies the body whose `guildIcon` is null, so the file the
         * icon was verified against is deleted and the bundle icon comes back. The stored choice is a
         * preference and stays; the file itself is the runner's check, after the phase.
         */
        async function stepPersonGuildIconGone() {
          const icon = await waitUntil(
            () => call('nod.appIcon'),
            (state) => state.guildIconAvailable === false,
            STATE_TIMEOUT_MS,
            (state) => 'guildIconAvailable = ' + JSON.stringify(state.guildIconAvailable),
          );
          return (
            'guildIconAvailable false after the sync (the stored choice is still ' +
            JSON.stringify(icon.choice) +
            ')'
          );
        }

        // ----------------------------------------------------------- K2/K4/K6/K8 — the admin shares

        /**
         * K2/RF-45: the colleagues as this machine pinned them. The fingerprint each machine
         * reported to the desk is what has to be pinned here: the pin is that person's own key, and
         * a `changed` one would refuse every send (SP06 §3 step 2).
         */
        async function stepPeersPinned() {
          const ids = await adminIds();
          shared.guildPersonId = ids.me.id;
          shared.personId = ids.person.id;
          shared.otherPersonId = ids.other.id;
          shared.toolId = ids.toolA.id;
          shared.toolBId = ids.toolB.id;
          const peers = await call('peers.list');
          const wanted = [
            { who: 'the first member', personId: ids.person.id, note: CONFIG.notes.person },
            { who: 'the second member', personId: ids.other.id, note: CONFIG.notes.other },
          ];
          const lines = [];
          for (const target of wanted) {
            const row = peers.find((peer) => peer.personId === target.personId) || null;
            expect(row !== null, target.who + ' is not in peers.list');
            expect(
              row.status === 'pinned',
              'the status of ' + target.who + ' is ' + JSON.stringify(row.status),
            );
            const reported = await desk('/desk/note?key=' + target.note);
            expect(
              row.fingerprint === reported.value,
              'the pinned fingerprint of ' + target.who + ' is not the one that machine reported',
            );
            lines.push(target.who + ' pinned ' + shortDigest(row.fingerprint));
          }
          return lines.join('; ');
        }

        /**
         * B7/SP04 §2: a later launch of this machine reads the personal tool and the favorite out of
         * the last signed snapshot — the sync of the publish phase is what took them up, so nothing
         * of the outbox is left to explain them.
         */
        async function stepPersonalFromSnapshot() {
          const list = await call('catalog.list');
          const personal = list.filter((entry) => entry.scope === 'personal');
          expect(
            personal.length === 1,
            'personal entries: ' + summarize(personal.map((entry) => entry.id)),
          );
          expect(personal[0].title === PERSONAL_TOOL_TITLE, 'the title moved: ' + summarize(personal[0].title));
          const favorites = await call('favorites.list');
          expect(
            favorites.length === 1 && favorites[0] === personal[0].id,
            'favorites.list = ' + summarize(favorites),
          );
          expect(
            list.length > 0 && list[0].id === personal[0].id,
            'the favorite does not lead the order: ' + summarize(list.map((entry) => entry.id)),
          );
          shared.personalToolId = personal[0].id;
          return 'the snapshot carries the personal tool and the favorite: ' + personal[0].id + ' leads';
        }

        /** K4/SP06 §4: the credential the owner is about to share, with the value of the run. */
        async function stepSaveShared() {
          expect(shared.toolId !== null, 'the granted tool is not known');
          const item = await call('vault.save', {
            toolId: shared.toolId,
            username: SHARE_USERNAME,

          expect(item.scope === 'role', 'a new credential carries scope ' + JSON.stringify(item.scope));
          return 'the credential of ' + item.toolId + ' saved (value only in the keychain)';
        }

        async function stepScopeRole() {
          const item = await call('vault.setScope', { toolId: shared.toolId, scope: 'role' });
          expect(item.scope === 'role', 'the scope read back as ' + JSON.stringify(item.scope));
          const recipients = await call('shares.recipients', { toolId: shared.toolId });
          const allowed = recipients.filter((row) => row.allowed);
          expect(
            allowed.length === 2 && recipients.length === 2,
            'the scope allows ' + allowed.length + ' of ' + recipients.length + ' recipient(s)',
          );
          for (const row of recipients) {
            expect(
              row.keyStatus === 'pinned',
              row.name + ' has keyStatus ' + JSON.stringify(row.keyStatus) + ' (' + summarize(row.reason) + ')',
            );
            expect(row.fingerprint !== null, row.name + ' has no pinned fingerprint');
          }
          return 'scope role: both members of team are recipients (' + summarize(allowed.map((row) => row.name)) + ')';
        }

        /** K4/SP06 §4: one sealed copy per recipient, behind the gate — the password, here. */
        async function stepSendShared() {
          expect(shared.personId !== null && shared.otherPersonId !== null, 'the members are not known');
          const answer = await call('shares.send', {

          return 'one sealed copy per member (' + answer.sent + '), nothing printed';

        /** K7/RF-54: the sender's own rows name the owner, and the sync is what brings them. */
        async function stepHoldersAfterSend() {
          const state = await call('host.syncNow');
          expect(state.status === 'connected', 'host.state.status = ' + JSON.stringify(state.status));
          const item = vaultItemOf(await call('vault.list'), shared.toolId);

          expect(
            owners.length === 1 && owners[0].personId === shared.guildPersonId,
            'the holder rows are ' + summarize(item.holders),
          );
          return 'the owner holder row is the admin (' + (item.holders || []).length + ' row(s) so far)';

          return 'the credential of ' + item.toolId + ' saved for the assignment (value in the keychain)';
        }

        /**
         * K8/RF-47: the admin's one action — the assignment row and the copies of the members the
         * host lists as missing, behind the one gate. The list clears on the member's accept, so
         * both members are still listed right after the seal.
         */
        async function stepAssignTeam() {
          expect(shared.toolBId !== null, 'the assigned tool is not known');
          const result = await call('assignments.set', {
            toolId: shared.toolBId,
            roleId: 'team',
            assigned: true,
            password: ACCOUNT_PASSWORD,

          expect(
            result !== null && typeof result === 'object' && result.sent === 2 && result.skipped === 0,

          );
          const missing = (await call('assignments.missing')).filter((row) => row.toolId === shared.toolBId);
          expect(
            missing.length === 2,
            'the missing list holds ' + missing.length + ' member(s) of the assigned role',
          );
          for (const row of missing) {
            expect(
              row.keyStatus === 'pinned',
              row.personName + ' has keyStatus ' + JSON.stringify(row.keyStatus),
            );
          }
          return 'role team assigned; ' + missing.length + ' member(s) without a copy yet, both pinned';
        }

        // ------------------------------------------------------ K4/K7 — the receivers

        async function stepInboxShares() {
          const inbox = await call('shares.inbox');
          expect(
            inbox.length === 2,
            'the inbox holds ' + inbox.length + ' share(s): ' + summarize(inbox.map((row) => row.kind)),
          );
          const sent = inbox.find((row) => row.kind === 'send') || null;
          const assigned = inbox.find((row) => row.kind === 'assign') || null;
          expect(sent !== null && assigned !== null, 'the kinds are ' + summarize(inbox.map((row) => row.kind)));
          expect(sent.fromName === 'Smoke Admin', 'the sender is ' + JSON.stringify(sent.fromName));
          expect(
            sent.scope === 'role' && assigned.scope === 'role',
            'the scopes are ' + summarize([sent.scope, assigned.scope]),
          );
          expect(sent.toolId !== assigned.toolId, 'both shares name the same tool');
          expect(sent.toolTitle !== null && assigned.toolTitle !== null, 'a share names no tool');
          shared.shareId = sent.id;
          shared.assignId = assigned.id;
          shared.sharedToolId = sent.toolId;
          shared.assignedToolId = assigned.toolId;
          return (
            'two open shares: a send of ' + sent.toolId + ' and an assign of ' + assigned.toolId + ' (metadata only)'
          );
        }

        /** K4/SP06 §4: the gate first (the password), then the copy lands in the vault. */
        async function stepAcceptShare() {
          const item = await call('shares.accept', { id: shared.shareId, password: ACCOUNT_PASSWORD });
          expect(!!item && item.toolId === shared.sharedToolId, 'shares.accept answered ' + summarize(item));
          expect(
            typeof item.credentialId === 'string' && item.credentialId.length > 0,
            'the item carries no credentialId',
          );
          expect(item.scope === 'role', 'the scope landed as ' + JSON.stringify(item.scope));
          return 'accepted: the copy is in the vault under the credential its sender owns';
        }

        /** K4: the value is the one the admin saved, read back through the gate. */
        async function stepRevealedShared() {
          const revealed = await call('vault.reveal', {
            toolId: shared.sharedToolId,
            password: ACCOUNT_PASSWORD,
          });
          expect(!!revealed && revealed.secret === SHARED_1, 'the revealed value is not the one the admin saved');
          expect(revealed.username === SHARE_USERNAME, 'the revealed username is not the one the admin saved');
          return 'revealed behind the password: the sender\'s own value (not printed)';
        }

        /** K5: the same gate, and the secret goes to the runtime's clipboard instead of the page. */
        async function stepCopiedShared() {
          const ok = await call('vault.copy', { toolId: shared.sharedToolId, password: ACCOUNT_PASSWORD });
          expect(ok === true, 'vault.copy answered ' + summarize(ok));
          return 'copied through the gate: the answer is true, and the value never came back to the page';
        }

        /** K7/RF-54: the holders come from the host's snapshot, and both sides read the same rows. */
        async function stepHoldersBoth() {
          const state = await call('host.syncNow');
          expect(state.status === 'connected', 'host.state.status = ' + JSON.stringify(state.status));
          const item = vaultItemOf(await call('vault.list'), shared.sharedToolId);
          expect(item !== null, 'the credential left the vault');
          const holders = item.holders || [];
          expect(holders.length === 2, 'the holder rows are ' + summarize(holders.map((row) => row.name)));
          const owners = holders.filter((row) => row.owner);
          expect(
            owners.length === 1 && owners[0].name === 'Smoke Admin',
            'the owner row is ' + summarize(owners.map((row) => row.name)),
          );
          expect(
            holders.some((row) => row.name === 'Smoke Person'),
            'this Nod is not among them: ' + summarize(holders.map((row) => row.name)),
          );
          for (const holder of holders) {
            expect(
              typeof holder.since === 'string' && holder.since.length > 0,
              'a holder row carries no date',
            );
            expect(holder.scope === 'role', 'a holder row carries scope ' + JSON.stringify(holder.scope));
          }
          return 'both holders with date and scope (' + holders.length + ' rows, owner Smoke Admin)';
        }

        async function stepAcceptAssign() {
          const item = await call('shares.accept', { id: shared.assignId, password: ACCOUNT_PASSWORD });
          expect(!!item && item.toolId === shared.assignedToolId, 'shares.accept answered ' + summarize(item));
          expect(
            typeof item.credentialId === 'string' && item.credentialId.length > 0,
            'the assigned item carries no credentialId',
          );
          return 'the assigned copy is in the vault (' + item.toolId + ')';
        }

        async function stepShareSync() {
          const state = await call('host.syncNow');
          expect(state.status === 'connected', 'host.state.status = ' + JSON.stringify(state.status));
          expect(state.pendingWrites === 0, 'pendingWrites = ' + JSON.stringify(state.pendingWrites));
          return 'status connected; the accepts went up and nothing is pending';
        }

        // ------------------------------------------------------------ K9 — update and rotation

        /** K7: both credentials now name the three people, and nothing is waiting to rotate. */
        async function stepHolderCounts() {
          const ids = await adminIds();
          shared.toolId = ids.toolA.id;
          shared.toolBId = ids.toolB.id;
          shared.personId = ids.person.id;
          shared.guildPersonId = ids.me.id;
          const items = await call('vault.list');
          for (const toolId of [ids.toolA.id, ids.toolB.id]) {
            const item = vaultItemOf(items, toolId);
            expect(item !== null, 'no credential for ' + toolId);
            const holders = item.holders || [];
            expect(holders.length === 3, toolId + ': the holder rows are ' + summarize(holders.map((row) => row.name)));
            expect(
              holders.filter((row) => row.owner && row.removedAt === null).length === 1,
              toolId + ': ' + summarize(holders),
            );
            expect(
              item.rotationPending === false,
              toolId + ': rotationPending = ' + JSON.stringify(item.rotationPending),
            );
          }
          return 'both credentials hold the admin, Smoke Person and Smoke Other (3 rows each, no rotation)';
        }

        /** K9/SP06 §4: the owner's save re-seals the new value to every live holder. */
        async function stepOwnerSavesAgain() {
          const before = vaultItemOf(await call('vault.list'), shared.toolId);
          expect(before !== null, 'the credential left the vault');
          const item = await call('vault.save', {
            toolId: shared.toolId,
            username: SHARE_USERNAME,
            secret: SHARED_2,
          });
          expect(item.credentialId === before.credentialId, 'the credential id changed on the save');
          expect(
            item.updateWarning === null || item.updateWarning === undefined,
            'the save answered ' + summarize(item.updateWarning),
          );
          const state = await call('host.syncNow');
          expect(state.status === 'connected', 'host.state.status = ' + JSON.stringify(state.status));
          return 'the owner saved a new secret; the update went out to both holders (no warning)';
        }

        /** K8/RF-47: both members accepted, so nothing is missing — the gated seal has no work. */
        async function stepMissingEmpty() {
          const missing = await call('assignments.missing');
          expect(missing.length === 0, 'the missing list still holds ' + missing.length + ' row(s)');
          const sealed = await call('assignments.sealMissing', { password: ACCOUNT_PASSWORD });
          expect(
            sealed && sealed.sent === 0 && sealed.skipped === 0,
            'assignments.sealMissing answered ' + summarize(sealed),
          );
          return 'nothing is missing: the gated seal had nothing to send';
        }

        /**
         * K9/SP06 §4: an `update` of a credential this Nod already holds is applied on the applied
         * snapshot, with no gate and nothing shown — the sync is the whole of it.
         */
        async function stepUpdateApplied() {
          const state = await call('host.syncNow');
          expect(state.status === 'connected', 'host.state.status = ' + JSON.stringify(state.status));
          expect(state.pendingWrites === 0, 'pendingWrites = ' + JSON.stringify(state.pendingWrites));
          return 'status connected: the sync accepted the update of a held credential (no gate)';
        }

        async function stepUpdatedSecret() {
          const list = await call('catalog.list');
          const entry = entryOfOrigin(list, CONFIG.originA);
          expect(entry !== null, 'the granted tool left the catalog');
          const revealed = await call('vault.reveal', { toolId: entry.id, password: ACCOUNT_PASSWORD });
          expect(!!revealed && revealed.secret === SHARED_2, 'the vault did not move to the new value');
          return 'the vault holds the value the owner saved last (not printed)';
        }

        async function stepInboxEmpty() {
          const state = await call('host.syncNow');
          expect(state.status === 'connected', 'host.state.status = ' + JSON.stringify(state.status));
          const inbox = await call('shares.inbox');
          expect(
            inbox.length === 0,
            'the inbox still holds ' + inbox.length + ' share(s): ' + summarize(inbox.map((row) => row.kind)),
          );
          return 'the inbox is empty: the host purged the share the sync accepted';
        }

        /** K9/RF-48: revoking a holder marks the credential rotation pending until a new secret. */
        async function stepRevokeHolder() {
          const ids = await adminIds();
          shared.toolId = ids.toolA.id;
          shared.personId = ids.person.id;
          const item = await call('shares.removeHolder', {
            toolId: shared.toolId,
            personId: shared.personId,
          });
          expect(!!item && item.toolId === shared.toolId, 'shares.removeHolder answered ' + summarize(item));
          const state = await call('host.syncNow');
          expect(state.status === 'connected', 'host.state.status = ' + JSON.stringify(state.status));
          const rotated = vaultItemOf(await call('vault.list'), shared.toolId);
          expect(rotated !== null, 'the credential left the vault');
          expect(
            rotated.rotationPending === true,
            'rotationPending = ' + JSON.stringify(rotated.rotationPending),
          );
          const removed = (rotated.holders || []).find((row) => row.personId === shared.personId) || null;
          expect(removed !== null && typeof removed.removedAt === 'string', 'the revoked row is ' + summarize(rotated.holders));
          expect(removed.owner === false, 'the owner was the one revoked');
          return (
            'the holder was revoked and the credential is rotation pending (' +
            (rotated.holders || []).length +
            ' row(s) kept)'
          );
        }

        /** K9/SP06 §4: the save that follows reaches the remaining holder and clears the state. */
        async function stepRotationCleared() {
          const item = await call('vault.save', {
            toolId: shared.toolId,
            username: SHARE_USERNAME,
            secret: SHARED_3,
          });
          expect(
            item.updateWarning === null || item.updateWarning === undefined,
            'the save answered ' + summarize(item.updateWarning),
          );
          const state = await call('host.syncNow');
          expect(state.status === 'connected', 'host.state.status = ' + JSON.stringify(state.status));
          const rotated = vaultItemOf(await call('vault.list'), shared.toolId);
          expect(rotated !== null, 'the credential left the vault');
          expect(
            rotated.rotationPending === false,
            'rotationPending = ' + JSON.stringify(rotated.rotationPending),
          );
          return 'the new secret reached the remaining holder and cleared the rotation';
        }

        // ------------------------------------------------- B7/K1 — the same person's second machine

        /** SP05 §5.3: a machine with no account of its own signs in to the guild it is pointed at. */
        async function stepSecondSignIn() {
          const found = await call('host.discover', { address: CONFIG.address });
          expect(found.guild === CONFIG.guild, 'guild = ' + JSON.stringify(found.guild));
          const answer = await call('host.signIn', {
            address: CONFIG.address,
            fingerprint: found.fingerprint,
            email: CONFIG.adminEmail,
            password: ACCOUNT_PASSWORD,
          });
          expect(answer && answer.kind === 'session', 'host.signIn answered ' + summarize(answer));
          const state = answer.session;
          expect(state.unlocked === true, 'unlocked = ' + JSON.stringify(state.unlocked));
          // The snapshot is what says who is an admin (SP05 §2): the join writes the local row from
          // the host's answer, and the first sync is what brings `me.admin` — the next step checks it.
          expect(
            !!state.person && state.person.email === CONFIG.adminEmail,
            'the person that signed in is ' + summarize(state.person && state.person.email),
          );
          shared.meId = state.person.id;
          return 'signed in as the guild admin on a second machine of the same person';
        }

        /**
         * canonico §22/SP06 §2: the pair is the person's, not the machine's — the second machine
         * adopts the one the host holds (the fingerprint the first machine reported) and publishes
         * nothing, which is what keeps every colleague's pin `pinned`. The same sync is what brings
         * the `admin` flag of a connected account (SP05 §2).
         */
        async function stepSecondPair() {
          const mine = await call('keys.mine');
          expect(
            !!mine && typeof mine.fingerprint === 'string' && mine.fingerprint.length > 0,
            'keys.mine answered ' + summarize(mine),
          );
          const first = await desk('/desk/note?key=' + CONFIG.notes.admin);
          expect(
            mine.fingerprint === first.value,
            'this machine holds another pair than the first machine of the same person',
          );
          const state = await call('host.syncNow');
          expect(state.status === 'connected', 'host.state.status = ' + JSON.stringify(state.status));
          expect(state.pendingWrites === 0, 'pendingWrites = ' + JSON.stringify(state.pendingWrites));
          const session = await call('session.state');
          expect(
            !!session.person && session.person.admin === true,
            'the snapshot did not say this person is the admin',
          );
          return 'the same pair as the first machine (adopted, nothing published): ' + shortDigest(mine.fingerprint);
        }

        /** B7/SP04 §2: the personal tool and the favorite arrive inside the signed snapshot. */
        async function stepSecondPersonal() {
          expect(shared.meId !== null, 'this machine has no person id');
          const list = await call('catalog.list');

          expect(personal[0].ownerId === shared.meId, 'the owner is ' + summarize(personal[0].ownerId));
          expect(personal[0].title === PERSONAL_TOOL_TITLE, 'the title is not the one the first machine gave');
          const favorites = await call('favorites.list');
          expect(

            'the favorite does not lead the order: ' + summarize(list.map((entry) => entry.id)),
          );
          return 'the personal tool and its favorite came with the snapshot (' + personal[0].id + ' leads)';
        }

        async function run() {
          const sequence = PHASES[CONFIG.phase];
          if (!sequence) throw new Error('unknown phase ' + JSON.stringify(CONFIG.phase));
          let stopped = false;
          for (const [name, fn] of sequence) {
            if (stopped) {
              record(name, false, 'did not run', 0);
              continue;
            }
            const start = Date.now();
            let ok = false;
            let detail = '';
            try {
              detail = await fn();
              ok = true;
            } catch (error) {
              ok = false;
              detail = 'error: ' + message(error);
            }
            record(name, ok, detail, Date.now() - start);
            stopped = !ok;
            await writeResult(false, null);
          }
          await writeResult(true, null);
        }

        try {
          await waitForTiny();
          await run();
        } catch (error) {
          record('0 setup', false, 'error: ' + message(error), 0);
          await writeResult(true, message(error));
        }
      })();
    </script>
  </body>
</html>
